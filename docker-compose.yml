# ─────────────────────────────────────────────────────────────────────────────
# VedMoulya — Local Development Infrastructure
# Implements BLP-002/D07 DevOps Platform — Docker for local dev
# PH-002 — Enterprise Operations & Reliability (observability profile)
# ─────────────────────────────────────────────────────────────────────────────

services:
  # PostgreSQL — Primary database (BLP-002/D04)
  postgres:
    image: postgres:16-alpine
    container_name: vedmoulya-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: vedmoulya
      POSTGRES_PASSWORD: vedmoulya-dev
      POSTGRES_DB: vedmoulya
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vedmoulya']
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis — Cache, session store, pub/sub (BLP-002/D04)
  redis:
    image: redis:7-alpine
    container_name: vedmoulya-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # Prometheus — Metrics scraper (PH-002/T1 Observability) — optional
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: vedmoulya-prometheus
    restart: unless-stopped
    ports:
      - '9090:9090'
    volumes:
      - ./configs/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    profiles:
      - observability

  # OpenTelemetry Collector — OTLP ingest (PH-002/T1) — optional
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: vedmoulya-otel-collector
    restart: unless-stopped
    ports:
      - '4317:4317'
      - '4318:4318'
      - '8889:8889'
    volumes:
      - ./configs/observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    profiles:
      - observability

  # Grafana — Observability dashboard (BLP-002/D09) — optional
  grafana:
    image: grafana/grafana:11.3.0
    container_name: vedmoulya-grafana
    restart: unless-stopped
    ports:
      - '3002:3000'
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: 'Viewer'
    volumes:
      - grafana-data:/var/lib/grafana
      - ./configs/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./configs/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    profiles:
      - observability

volumes:
  postgres-data:
  grafana-data:
  prometheus-data:
