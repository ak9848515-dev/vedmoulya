# ─────────────────────────────────────────────────────────────────────────────
# VedMoulya — Local Development Infrastructure
# Implements BLP-002/D07 DevOps Platform — Docker for local dev
# ─────────────────────────────────────────────────────────────────────────────

services:
  # PostgreSQL — Primary database (BLP-002/D04)
  postgres:
    image: postgres:16-alpine
    container_name: vedmoulya-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: vedmoulya
      POSTGRES_PASSWORD: vedmoulya-dev
      POSTGRES_DB: vedmoulya
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vedmoulya']
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis — Cache, session store, pub/sub (BLP-002/D04)
  redis:
    image: redis:7-alpine
    container_name: vedmoulya-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # Grafana — Observability dashboard (BLP-002/D09) — optional
  grafana:
    image: grafana/grafana:latest
    container_name: vedmoulya-grafana
    restart: unless-stopped
    ports:
      - '3002:3000'
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: 'Viewer'
    volumes:
      - grafana-data:/var/lib/grafana
    profiles:
      - observability

volumes:
  postgres-data:
  grafana-data:
