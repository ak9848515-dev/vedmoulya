# ─────────────────────────────────────────────────────────────────────────────
# VedMoulya — Release Pipeline
# Implements BLP-001/D10 Release Strategy
# ─────────────────────────────────────────────────────────────────────────────

name: Release

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Release stage'
        required: true
        default: 'alpha'
        type: choice
        options:
          - alpha
          - internal-beta
          - closed-beta
          - public-beta
          - rc
          - ga

env:
  NODE_VERSION: '22'

# Deployment targets (see docs/ops/DEPLOYMENT_GUIDE.md):
#   Web app (Life OS + gateway)  → Vercel
#   API gateway image            → GHCR (consumed by Railway / VPS)
#   Database / Redis / storage   → managed providers (Railway / Upstash / S3)
#
# Secrets to configure per environment (Settings → Environments → <stage>):
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID   (web deploy)
#   WEB_URL                                          (smoke-test target)
# Steps requiring a missing secret are skipped, so the pipeline stays green
# until infrastructure credentials are provisioned.

jobs:
  validate:
    name: Pre-release validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Security audit
        run: npm audit --audit-level=critical

  deploy:
    name: Deploy (${{ github.event.inputs.stage }})
    runs-on: ubuntu-latest
    needs: [validate]
    environment: ${{ github.event.inputs.stage }}
    concurrency:
      group: deploy-${{ github.event.inputs.stage }}
      cancel-in-progress: false
    permissions:
      contents: write # git tag push (ga)
      packages: write # GHCR image push (rc/ga)
    env:
      STAGE: ${{ github.event.inputs.stage }}
      WEB_URL: ${{ secrets.WEB_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build:core
      - run: npm run build -w apps/web

      # ── 1. Web app (Life OS + gateway) → Vercel ──────────────────────────
      - name: Deploy web app to Vercel
        id: deploy-vercel
        if: env.VERCEL_TOKEN != ''
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -o pipefail
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN" --yes \
            | tee /tmp/vercel-deploy-url.txt
          URL="$(grep -oE 'https://[^ ]+' /tmp/vercel-deploy-url.txt | head -1)"
          echo "Deployed URL: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      # ── 2. API gateway image → GHCR (consumed by Railway / VPS) ───────────
      - name: Log in to GHCR
        if: github.event.inputs.stage == 'rc' || github.event.inputs.stage == 'ga'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API gateway image
        if: github.event.inputs.stage == 'rc' || github.event.inputs.stage == 'ga'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-api:latest
            ghcr.io/${{ github.repository }}-api:${{ github.sha }}

      # ── 3. Smoke test the deployed gateway ────────────────────────────────
      # Prefer the just-deployed URL from the Vercel step; fall back to the
      # per-environment WEB_URL secret when a deploy did not run.
      - name: Smoke test deployed gateway
        env:
          TARGET_URL: ${{ steps.deploy-vercel.outputs.url || env.WEB_URL }}
        if: steps.deploy-vercel.outputs.url != '' || env.WEB_URL != ''
        run: |
          bash scripts/deploy/smoke-test.sh "$TARGET_URL"

      # ── 4. Tag the release (ga only) ──────────────────────────────────────
      - name: Tag release
        if: github.event.inputs.stage == 'ga'
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          git tag "$VERSION" "${{ github.sha }}"
          git push origin "$VERSION"

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - uses: actions/checkout@v4
      - name: Generate release notes
        run: |
          echo "# Release ${{ github.event.inputs.stage }}" > release-notes.md
          echo "Released: $(date)" >> release-notes.md
          echo "Commit: ${{ github.sha }}" >> release-notes.md
          echo "Target: ${{ secrets.WEB_URL || 'Vercel (auto-detected URL)' }}" >> release-notes.md
      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
