# ─────────────────────────────────────────────────────────────────────────────
# VedMoulya — OpenTelemetry Collector Configuration
# Receives OTLP traces/metrics from services, exports to Prometheus + console.
# PH-002 — Enterprise Operations & Reliability (T1 Observability)
# ─────────────────────────────────────────────────────────────────────────────

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:
  logging:
    verbosity: normal
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: vedmoulya

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [logging]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, logging]
